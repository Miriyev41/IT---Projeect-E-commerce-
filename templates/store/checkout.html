{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="section-content padding-y bg">
    <div class="container">
        <form action="{% url 'place_order' %}" method="POST">
            {% csrf_token %}
            <div class="row">
                <aside class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title mb-4">Billing Address</h4>
                            <div class="form-row">
                                <div class="col form-group">
                                    <label for="">First Name</label>
                                    <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}" required>
                                </div>
                                <div class="col form-group">
                                    <label for="">Last Name</label>
                                    <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}" required>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col form-group">
                                    <label for="">Email</label>
                                    <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                                </div>
                                <div class="col form-group">
                                    <label for="">Phone Number</label>
                                    <input type="text" name="phone" class="form-control" value="{{ user.phone }}" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="">Address Line 1</label>
                                <input type="text" name="address_line_1" class="form-control" value="{{ userprofile.address_line_1 }}" required>
                            </div>
                            <div class="form-row">
                                <div class="col form-group">
                                    <label for="">City</label>
                                    <input type="text" name="city" class="form-control" value="{{ userprofile.city }}" required>
                                </div>
                                <div class="col form-group">
                                    <label for="">Country</label>
                                    <input type="text" name="country" class="form-control" value="{{ userprofile.country }}" required>
                                </div>
                            </div>
                        </div>
                    </div> 
                </aside>

                <aside class="col-lg-4">
                    <div class="card">
                        <div class="card-body">
                            <table class="table table-borderless table-shopping-cart">
                                <thead class="text-muted">
                                    <tr class="small text-uppercase">
                                        <th scope="col">Product</th>
                                        <th scope="col" width="50">Qty</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for cart_item in cart_items %}
                                    <tr>
                                        <td>
                                            <figure class="itemside align-items-center">
                                                <div class="aside"><img src="{{ cart_item.product.images.url }}" class="img-sm"></div>
                                                <figcaption class="info">
                                                    <a href="{{ cart_item.product.get_url }}" class="title text-dark">{{ cart_item.product.product_name }}</a>
                                                    <p class="text-muted small">PLN {{ cart_item.product.price }} each</p>
                                                </figcaption>
                                            </figure>
                                        </td>
                                        <td> 
                                            <label for="">{{ cart_item.quantity }}</label> 
                                        </td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>

                            <button type="submit" name="submit" class="btn btn-primary btn-block">Confirm Order</button>
                            <a href="{% url 'store' %}" class="btn btn-light btn-block">Continue Shopping</a>
                        </div> 
                    </div> 
                </aside> 
            </div> 
        </form> </div> 
</section>
{% endblock %}
