{% extends 'base.html' %}

{% block content %}
<section class="section-content padding-y bg" style="min-height:84vh">
    <div class="card mx-auto" style="max-width:520px; margin-top:40px;">
      <article class="card-body">
        <header class="mb-4"><h4 class="card-title">Sign up</h4></header>
        {% include 'includes/alerts.html' %}
        <form action="{% url 'register' %}" method="POST">
            {% csrf_token %}
            <div class="row mb-3">
                <div class="col form-group">
                    <label>First name</label>
                    <input type="text" class="form-control" name="first_name" placeholder="First Name" required>
                </div>
                <div class="col form-group">
                    <label>Last name</label>
                    <input type="text" class="form-control" name="last_name" placeholder="Last Name" required>
                </div>
            </div>
            <div class="form-group mb-3">
                <label>Email</label>
                <input type="email" class="form-control" name="email" placeholder="Email Address" required>
            </div>
            <div class="form-group mb-3">
                <label>Phone Number</label>
                <input type="text" class="form-control" name="phone_number" placeholder="Phone Number" required>
            </div>
            <div class="row mb-4">
                <div class="form-group col-md-6">
                    <label>Create password</label>
                    <input class="form-control" type="password" name="password" required>
                </div>
                <div class="form-group col-md-6">
                    <label>Repeat password</label>
                    <input class="form-control" type="password" name="confirm_password" required>
                </div>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block w-100"> Register </button>
            </div>        
        </form>
      </article>
    </div>
    <p class="text-center mt-4">Have an account? <a href="{% url 'login' %}">Log In</a></p>
</section>
{% endblock %}
