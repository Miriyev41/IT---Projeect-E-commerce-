{% extends 'base.html' %}

{% block content %}
<section class="section-conten padding-y bg" style="min-height:84vh">
    <div class="card mx-auto" style="max-width: 380px; margin-top:100px;">
      <div class="card-body">
      <h4 class="card-title mb-4">Sign in</h4>
      {% include 'includes/alerts.html' %}
      <form action="{% url 'login' %}" method="POST">
          {% csrf_token %}
          <div class="form-group mb-3">
             <label>Email Address</label>
             <input type="email" class="form-control" name="email" placeholder="Email Address" required>
          </div>
          <div class="form-group mb-3">
            <label>Password</label>
            <input type="password" class="form-control" name="password" placeholder="Password" required>
            <a href="{% url 'password_reset' %}" class="float-right small mt-1">Forgot password?</a>
          </div>
          
          <div class="form-group">
              <button type="submit" class="btn btn-primary btn-block w-100"> Login </button>
          </div> 
      </form>
      </div> 
    </div> 

     <p class="text-center mt-4">Don't have account? <a href="{% url 'register' %}">Sign up</a></p>
</section>
{% endblock %}
